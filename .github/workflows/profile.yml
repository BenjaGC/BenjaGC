name: Actualizar actividad del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/profile.yml
      - scripts/**

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dibujar calendario animado
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: BenjaGC
          outputs: |
            assets/github-snake.svg?color_snake=#9f73e5&color_dots=#e5edf5,#bbe9dc,#79d7bc,#3fb69d,#238572
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#ff9a7b&color_dots=#1c3044,#224b50,#2e776d,#4eb59c,#6ee6ce
      - name: Actualizar estadísticas públicas y alternativa sin movimiento
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-profile.mjs
      - name: Guardar gráficos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualizar gráficos del perfil"
          git push
